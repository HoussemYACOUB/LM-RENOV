<section id="scanner" class="section alt-section">
  <div class="container scanner-grid">
    <div class="section-heading reveal">
      <p class="eyebrow">Connexion rapide</p>
      <h2>Scannez un code-barres pour visiter notre boutique</h2>
    </div>
    <div class="scanner-card reveal">
      <p>Utilisez la caméra de votre appareil pour lire un code-barres et accéder directement à notre site commercial.</p>
      <div class="scanner-actions">
        <button id="start-scan" class="btn btn-primary" type="button">Démarrer le scanner</button>
        <button id="stop-scan" class="btn btn-secondary" type="button">Arrêter</button>
      </div>
      <div class="scanner-box">
        <video id="barcode-video" autoplay muted playsinline></video>
        <p id="scanner-status" class="scanner-status">Prêt à scanner.</p>
      </div>
    </div>
  </div>
</section>
